name: Repository quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python tests/check-docs.py
      - run: node tests/smoke.cjs
      - run: node tests/ai-handoff.cjs
      - run: node tests/visual-review.cjs
      - run: node tests/book-quiz.cjs
      - run: git diff --check
